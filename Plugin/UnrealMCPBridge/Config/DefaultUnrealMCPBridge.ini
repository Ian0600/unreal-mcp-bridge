; Unreal MCP Bridge listener settings — IFSR values.
;
; This copy intentionally differs from the plugin repository, which ships the
; bridge disabled. Keep the values below when mirroring the plugin into this
; project, or the listener goes silent.
;
; Config hierarchy for the UnrealMCPBridge branch (lowest priority first):
;   1. Plugins/UnrealMCPBridge/Config/DefaultUnrealMCPBridge.ini   <- this file, hand edited
;   2. <Project>/Config/DefaultUnrealMCPBridge.ini                 <- optional per project override
;   3. <Project>/Saved/Config/<Platform>/UnrealMCPBridge.ini       <- written by Project Settings
;
; The engine never writes back into this file; edits made in
; Edit > Project Settings > Plugins > Unreal MCP Bridge land in the Saved file,
; and only values that differ from this one are recorded there.
;
; This file must exist. A plugin config branch with no static layer is dropped
; on load, after which the settings are read through a no-save fallback and
; changes stop persisting.
;
; Port matches UMCP_PORT for the "unreal" server in Workspace_IFSR_Main/.mcp.json.
; AdditionalPorts matches UMCP_PORT in Workspace_IFSR_Main/.codex/config.toml.
; 리스너는 클라이언트마다 스레드를 띄우므로 포트 하나(30100)에 Claude 세션 · Codex 가
; 여럿 동시에 붙는다(2026-10-28). 30101 은 그 포트를 쓰던 기존 클라이언트 설정이 계속
; 붙도록 남겨 둔 것이고, 포트를 더 늘릴 필요는 없다.

[/Script/UnrealMCPBridge.MCPSettings]
bEnabled=True
Host=127.0.0.1
Port=30100
+AdditionalPorts=30101
GameThreadDispatchTimeoutSeconds=30
MaxLineBytes=16777216
